[project]
name = "ai_scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.2",
    "html2text>=2025.4.15",
    "inscriptis>=2.7.2",
    "patchright>=1.61.2",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "readability-lxml>=0.8.4.1",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "trafilatura>=2.1.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ai-scraper = "ai_scraper.__main__:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "testcontainers[mysql]>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_scraper"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (network / browser). Skipped by default.",
]
addopts = "-m 'not slow'"
# NOTE: When running slow tests (Playwright), invoke pytest with -p no:asyncio.
# pytest-asyncio's event loop setup breaks Chromium's connection lifecycle
# and produces ERR_NETWORK_CHANGED. See tests/test_google_smoke.py.
# xvfb-run -a uv run pytest tests/test_google_smoke.py -v -m slow -s -p no:asyncio